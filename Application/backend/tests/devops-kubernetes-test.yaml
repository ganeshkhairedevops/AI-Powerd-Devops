apiVersion: v1
kind: Namespace
metadata:
  name: devops-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
  namespace: devops-demo
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: devops-demo
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: devops-demo
data:
  environment: production
  log_level: info
  application: nginx-web

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa
  namespace: devops-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-web
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# Docker configuration
docker:
  image: nginx:1.27
  container_port: 80
  restart_policy: unless-stopped

# Terraform configuration
terraform:
  provider: aws
  region: us-east-1
  instance_type: t3.micro

# Monitoring configuration
monitoring:
  prometheus: enabled
  grafana: enabled
  alerting: enabled

# Jenkins configuration
jenkins:
  pipeline: devops-deployment
  branch: main
  deploy_environment: production