
name: DevOps Agent - Build, Scan and Deploy

on:
  push:
    branches:
      - feat-github-actions
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_IMAGE: ganeshkhaire14/devops-ai-backend
  FRONTEND_IMAGE: ganeshkhaire14/devops-ai-frontend

jobs:
  backend-test:
    name: Validate Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r Application/backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q Application/backend

  frontend-test:
    name: Validate Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Application/frontend/package-lock.json

      - name: Install dependencies
        working-directory: Application/frontend
        run: npm ci

      - name: Build frontend
        working-directory: Application/frontend
        run: npm run build

  build-scan-publish:
    name: Build, Scan and Publish Images
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-test

    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build \
            -t "$BACKEND_IMAGE:${GITHUB_SHA}" \
            -t "$BACKEND_IMAGE:latest" \
            -f Application/backend/Dockerfile \
            Application/backend

      - name: Build frontend image
        run: |
          docker build \
            -t "$FRONTEND_IMAGE:${GITHUB_SHA}" \
            -t "$FRONTEND_IMAGE:latest" \
            -f Application/frontend/Dockerfile \
            Application/frontend

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          version: latest

      - name: Scan backend image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$BACKEND_IMAGE:${GITHUB_SHA}"

      - name: Scan frontend image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$FRONTEND_IMAGE:${GITHUB_SHA}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish backend image
        run: |
          docker push "$BACKEND_IMAGE:${GITHUB_SHA}"
          docker push "$BACKEND_IMAGE:latest"

      - name: Publish frontend image
        run: |
          docker push "$FRONTEND_IMAGE:${GITHUB_SHA}"
          docker push "$FRONTEND_IMAGE:latest"

  deploy-windows:
    name: Deploy on Windows PC
    runs-on: [self-hosted, windows, x64]
    needs: build-scan-publish

    steps:
      - uses: actions/checkout@v4

      - name: Configure deployment environment
        shell: powershell
        run: |
          $env:KUBE_CONFIG_PATH = Join-Path $env:USERPROFILE ".kube"
          if (-not (Test-Path $env:KUBE_CONFIG_PATH)) {
            throw "Kubernetes config directory not found: $env:KUBE_CONFIG_PATH"
          }
          docker info
          docker compose version

      - name: Pull published images
        shell: powershell
        working-directory: Application
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $env:KUBE_CONFIG_PATH = Join-Path $env:USERPROFILE ".kube"
          $env:DOCKER_CONFIG = Join-Path $env:RUNNER_TEMP "docker-config"
          New-Item -ItemType Directory -Force -Path $env:DOCKER_CONFIG | Out-Null
          $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) { throw "Docker Hub login failed" }

          docker compose pull backend frontend
          if ($LASTEXITCODE -ne 0) { throw "Image pull failed" }

      - name: Deploy with Compose
        shell: powershell
        working-directory: Application
        run: |
          $env:KUBE_CONFIG_PATH = Join-Path $env:USERPROFILE ".kube"
          docker compose up -d --no-build
          if ($LASTEXITCODE -ne 0) { throw "Compose deployment failed" }

          docker compose ps
          if ($LASTEXITCODE -ne 0) { throw "Compose status check failed" }

      - name: Log out of Docker Hub
        if: always()
        shell: powershell
        run: |
          docker logout
          if ($env:DOCKER_CONFIG) {
            Remove-Item -Recurse -Force $env:DOCKER_CONFIG -ErrorAction SilentlyContinue
          }

  deploy-linux:
    name: Deploy on Linux server14
    runs-on: ubuntu-latest
    needs: build-scan-publish

    steps:
      - name: Set up SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull images and deploy remotely
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu

          test -n "$SSH_HOST"
          test -n "$SSH_USER"

          printf -v remote_command '%s' \
            'cd "$HOME/AI/AI-Powerd-Devops" && git pull --ff-only origin feat-github-actions && cd Application && export KUBE_CONFIG_PATH="$HOME/.kube" && docker compose pull backend frontend && docker compose up -d --no-build && docker compose ps'

          printf '%s' "$DOCKERHUB_TOKEN" | \
            ssh -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "docker login -u '$DOCKERHUB_USERNAME' --password-stdin && bash -lc $(printf '%q' "$remote_command")"

      - name: Remove SSH credentials
        if: always()
        run: rm -rf ~/.ssh
